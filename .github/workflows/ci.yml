name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Compile-check every script (no third-party deps needed for this).
      - name: Compile scripts
        run: python -m py_compile skills/youtube-interview-digest/scripts/*.py

      # Run the stdlib-only security/escaping tests.
      - name: Run tests
        run: python -m unittest discover -s tests -v
