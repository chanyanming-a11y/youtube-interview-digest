name: Release

# Auto-publish a GitHub Release whenever a version tag (v*) is pushed.
# This removes the manual UI step: just push a tag and CI creates the Release
# from the matching CHANGELOG.md section and marks it as Latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import re
          tag = "${{ github.ref_name }}"            # e.g. v1.1.3
          ver = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # NOTE: keep [^\n]* (not .*) for the heading line — with re.S, `.` also
          # matches newlines, so a greedy `.*\n` swallows the whole file and the
          # capture group ends up empty (that produced blank Release notes v1.1.3+).
          pat = re.compile(
              r"^##\s+v?" + re.escape(ver) + r"\b[^\n]*\n(.*?)(?=^##\s|\Z)",
              re.M | re.S,
          )
          m = pat.search(text)
          body = m.group(1).strip() if m else f"See CHANGELOG.md for {tag}."
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          print(f"Extracted release notes for {tag} ({len(body)} chars)")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md \
            --latest
