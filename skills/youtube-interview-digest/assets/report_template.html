<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>__TITLE__</title>
<style>
/* One accent colour (timecodes and the few things that need to stand out), everything else is ink + greys. */
:root{
  --bg:#faf9f7;--paper:#fff;--ink:#1c1b1a;--sub:#55524e;--mute:#8c8782;--line:#e6e3de;--line2:#f0eeea;
  --accent:#b3261e;--accent-bg:#f8ecea;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
b{font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding:28px 28px 0;display:grid;grid-template-columns:420px 1fr;gap:48px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr;gap:24px;padding:16px}.side{position:static!important;max-height:none!important}}

/* ---------- sidebar */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 40px);overflow:auto;padding-bottom:12px;scrollbar-width:thin}
.side>*{flex:none}
.player{background:#000;border-radius:6px;overflow:hidden;aspect-ratio:16/9;position:relative}
.player iframe,.player #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .fallback{position:absolute;inset:0;display:none;background:#0d0d0d center/cover no-repeat;color:#fff;cursor:pointer;text-align:center}
.player .fallback::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.42),rgba(8,8,8,.05) 42%,rgba(8,8,8,.86))}
.player .fallback>*{position:relative;z-index:1}
.player .fb-center{position:absolute;inset:0 0 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 16px}
.player .fb-play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .18s ease,box-shadow .18s ease}
.player .fallback:hover .fb-play{transform:scale(1.09);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.player .fb-play svg{width:22px;height:22px;fill:#14110f;margin-left:3px}
.player .fb-label{font-weight:600;font-size:13.5px;line-height:1.5;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.player .fb-note{font-size:11.5px;line-height:1.55;color:#cecac4;max-width:300px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.player .fb-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:12px;background:linear-gradient(0deg,rgba(8,8,8,.9),rgba(8,8,8,.45) 60%,transparent)}
.player .fb-bar .grow{flex:1;min-width:0;color:#bdb8b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.player .fb-copy{flex:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:13px;padding:3px 10px;font:inherit;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.player .fb-copy:hover{background:rgba(255,255,255,.24)}
.player .fb-copy.done{background:#fff;color:#14110f;border-color:#fff}
.player .fb-open{flex:none;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.55);padding-bottom:1px}
/* clean (no-distraction) surface — an always-on shield over the iframe.
   Cross-origin YouTube chrome (title bar, channel row, "more videos", end-screen
   suggestions, share/watch-later, watermark) can't be styled away; instead the
   shield swallows every pointer event so YouTube never even gets a hover, and
   switches to an opaque poster cover while paused/ended. Our own minimal controls
   live in .cbar. */
.player .clean{position:absolute;inset:0;z-index:3;cursor:pointer;visibility:hidden;background:transparent}
.player .clean.on{background:#0d0d0d}
.player .clean .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
.player .clean.on .cimg{display:block}
.player .clean::after{content:"";position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .2s ease}
.player .clean.on::after{opacity:1;background:linear-gradient(180deg,rgba(8,8,8,.32),rgba(8,8,8,.03) 44%,rgba(8,8,8,.5))}
.player .clean .cplay{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.player .clean.on .cplay{display:flex}
.player .clean .cbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .18s ease}
.player .clean:hover .cbtn{transform:scale(1.08)}
.player .clean .cbtn svg{width:22px;height:22px;fill:#14110f;margin-left:3px}
.player .clean .ctxt{font-size:12.5px;font-weight:600;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.player .ctoggle{position:absolute;top:9px;right:9px;z-index:6;font:inherit;font-size:11px;line-height:1.4;color:#fff;background:rgba(20,17,15,.6);border:1px solid rgba(255,255,255,.34);border-radius:12px;padding:3px 9px;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s ease}
.player:hover .ctoggle,.player .ctoggle:focus{opacity:1}
/* our own minimal controls (clean mode) */
.player .cbar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:10px;padding:9px 11px;background:linear-gradient(0deg,rgba(8,8,8,.8),rgba(8,8,8,.15) 65%,transparent);opacity:0;pointer-events:none;transition:opacity .2s ease}
.player:hover .cbar,.player .cbar.show{opacity:1;pointer-events:auto}
.player .cbar .ptrack{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3);cursor:pointer;position:relative}
.player .cbar .pfill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#e23b2e;width:0}
.player .cbar .ptime{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#fff;white-space:nowrap}
.player .cbar button{font:inherit;font-size:11.5px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:3px 9px;cursor:pointer;transition:background .15s ease}
.player .cbar button:hover{background:rgba(255,255,255,.3)}
.player .fallback{z-index:7}
.panel h4{margin:0 0 8px;font-size:12px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;align-items:baseline}
.panel+.panel{border-top:1px solid var(--line);padding-top:16px}
.now{font:12px var(--mono);color:var(--mute)}
.heat svg{width:100%;height:84px;display:block;cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:2px;margin-right:5px;vertical-align:3px}
.toc a{display:block;padding:3px 0;text-decoration:none;color:var(--sub);font-size:14px}
.toc a:hover{color:var(--accent)}
.chap{display:grid;grid-template-columns:62px 1fr;font-size:13px;padding:2px 0;color:var(--sub)}
.tip{font-size:12px;color:var(--mute);line-height:1.6}

/* ---------- main column: one continuous document, sections separated by rules */
main{min-width:0;max-width:820px;padding-bottom:40px}
.hero{padding:4px 0 28px;border-bottom:1px solid var(--ink)}
.kicker{font-size:13px;color:var(--mute)}
.hero h1{font-family:var(--serif);font-size:30px;line-height:1.35;font-weight:700;margin:6px 0 6px;letter-spacing:.01em}
.orig{font-size:13px;color:var(--mute);margin-bottom:14px}
.metaline{font-size:13px;color:var(--sub)}
.metaline span+span::before{content:"·";margin:0 8px;color:var(--mute)}
.people{font-size:13px;color:var(--sub);margin-top:2px}
.oneliner{margin:22px 0 0;font-family:var(--serif);font-size:20px;line-height:1.6;font-weight:600}
.kw{margin-top:12px;font-size:13px;color:var(--mute)}

section{padding:34px 0 30px;border-bottom:1px solid var(--line);scroll-margin-top:16px}
section:last-of-type{border-bottom:0}
section>h2{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:.01em}
section>.desc{color:var(--mute);font-size:13px;margin:0 0 18px}
section>h2+*:not(.desc){margin-top:16px}
h3.sub{font-size:13px;font-weight:600;color:var(--mute);margin:26px 0 6px;letter-spacing:.04em}

/* list rows: timecode column + text */
ul.clean{list-style:none;padding:0;margin:0}
ul.clean>li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
ul.clean>li:first-child{border-top:0}

/* timecode: plain monospace link in the accent colour */
a.ts{font:500 13px/1.8 var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap;border-radius:3px}
a.ts:hover{text-decoration:underline;text-underline-offset:3px}
a.ts.inline{font-size:.9em;margin:0 1px}
a.ts.playing{background:var(--accent-bg)}

/* value */
.value{display:grid;grid-template-columns:110px 1fr;gap:24px;align-items:start}
.score{padding-top:2px}
.score b{font-family:var(--serif);font-size:44px;line-height:1;font-weight:700}
.score span{font-size:14px;color:var(--mute);margin-left:2px}
.score small{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.who{font-size:14px;color:var(--sub);margin-bottom:8px}
.who em{font-style:normal;color:var(--mute)}
.caveat{margin-top:18px;font-size:13px;color:var(--sub);border-left:2px solid var(--line);padding:2px 0 2px 14px}
.caveat em{font-style:normal;color:var(--mute);display:block;margin-bottom:2px}

/* framework timeline */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:1px;background:var(--line)}
.node{position:relative;padding-bottom:22px}
.node::before{content:"";position:absolute;left:-20px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.node h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.node .range{font:12px var(--mono);color:var(--mute);font-weight:400}
.node p{margin:4px 0 6px;color:var(--sub)}
.node ul{margin:0;padding:0;list-style:none}
.node li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:14px;padding:1px 0}

/* viewpoints */
.vp{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 36px}
.vcard{padding:14px 0;border-top:1px solid var(--line2)}
.vcard h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.vcard p{margin:0;color:var(--sub);font-size:14px}
.vcard .ev{margin-top:6px;font-size:13px;color:var(--mute)}
.speaker{font-size:12px;color:var(--mute);margin-bottom:2px}

/* quotes */
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px 36px}
blockquote{margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
blockquote .zh{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.65}
blockquote .en{font-size:13px;color:var(--mute);margin-top:4px;font-style:italic}
blockquote .why{font-size:13px;color:var(--sub);margin-top:6px}
blockquote footer{display:flex;gap:10px;align-items:baseline;margin-top:6px;font-size:12px;color:var(--mute)}

/* conflicts */
.cf{padding:18px 0;border-top:1px solid var(--line2)}
.cf:first-of-type{border-top:0;padding-top:4px}
.cf h3{margin:0 0 10px;font-size:16px;font-weight:600}
.ctype{font-size:12px;color:var(--mute);font-weight:400;margin-left:10px}
.vs{display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;align-items:stretch}
.vsx{background:var(--line)}
.side-a,.side-b{font-size:14px;color:var(--ink)}
.side-a b,.side-b b{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:2px}
.cf .an{margin-top:12px;font-size:14px;color:var(--sub)}
.cf .an em,.hs .sup em{font-style:normal;color:var(--ink);font-weight:600;margin-right:6px}
@media(max-width:640px){.vs{grid-template-columns:1fr}.vsx{display:none}.value{grid-template-columns:1fr}}

/* hotspots */
.hs{display:grid;grid-template-columns:64px 1fr;gap:4px 14px;padding:18px 0;border-top:1px solid var(--line2)}
.hs:first-of-type{border-top:0;padding-top:4px}
.hs .meter{grid-row:span 3;padding-top:2px}
.hs .meter b{display:block;font:600 20px/1.1 var(--mono)}
.hs .meter .bar{height:2px;background:var(--line);margin:6px 0 3px;width:48px}
.hs .meter .bar i{display:block;height:2px;background:var(--accent)}
.hs .meter small{font-size:11px;color:var(--mute)}
.hs h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hs .range{font:12px var(--mono);color:var(--mute);font-weight:400}
.src{font-size:12px;color:var(--mute);font-weight:400}
.hs p{margin:0;color:var(--sub);font-size:14px}
.hs .sup{font-size:14px;color:var(--sub);margin-top:6px}
.cmts{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cmt{font-size:13px;color:var(--sub);padding-left:12px;border-left:2px solid var(--line)}
.cmt em{font-style:normal;color:var(--mute);font-size:12px;margin-left:8px;white-space:nowrap}

/* comment insights */
.ci{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 36px}
.ci>div{padding:14px 0;border-top:1px solid var(--line2)}
.ci h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stance{font-size:12px;color:var(--mute);font-weight:400;white-space:nowrap}
.ci p{margin:0;font-size:14px;color:var(--sub)}
.ci .meta{margin-top:4px;font-size:12px;color:var(--mute);display:flex;gap:10px;align-items:baseline}

/* resources / glossary */
.res b{font-weight:600}
.res .note{color:var(--sub)}

/* transcript */
.tr-tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tr-tools input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:14px;background:var(--paper)}
.tr-tools input:focus{outline:none;border-color:var(--ink)}
.tr-tools button{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
.tr-tools button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
/* ---------- read-aloud toolbar (top, under title) */
.readbar{display:flex;align-items:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.readbar .rd{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);background:var(--paper);border-radius:20px;padding:7px 15px 7px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-weight:600;transition:background .15s ease,color .15s ease}
.readbar .rd:hover{background:var(--accent-bg)}
.readbar .rd.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.readbar .rd .ico{width:18px;height:18px;fill:currentColor;flex:none}
.readbar select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:13px;background:var(--paper);color:var(--sub)}
.readbar .tip{align-self:center}
/* reading highlight for the block currently being spoken */
.speaking{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent);border-radius:4px;scroll-margin:90px}
.tr{max-height:720px;overflow:auto;padding-right:8px;border-top:1px solid var(--line)}
.tr .row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line2)}
.tr .row.active{background:#fbf6e9}
.tr .row.hide{display:none}
.tr .spk{font-size:12px;color:var(--mute);font-weight:600;margin-right:6px}
.tr .en{display:none;color:var(--mute);font-size:13px;margin-top:2px}
.tr.bi .en{display:block}
.tr .row.speaking{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.tr-tools select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;font-size:13px;color:var(--sub);cursor:pointer}
.tr-tools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
mark{background:#f6e3a1;padding:0 1px}
.foot{color:var(--mute);font-size:12px;padding:24px 0 48px;border-top:1px solid var(--ink);margin-top:8px}
.foot a{text-underline-offset:3px}
.foot .build{color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-family:var(--mono);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="player">
      <div id="yt"></div>
      <div class="clean" id="clean" role="button" tabindex="0" aria-label="播放 / 继续播放">
        <img class="cimg" id="cleanImg" alt="" referrerpolicy="no-referrer">
        <div class="cplay">
          <div class="cbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="ctxt" id="cleanMsg">播放</div>
        </div>
      </div>
      <div class="cbar" id="cbar">
        <div class="ptrack" id="cprog"><div class="pfill" id="cpfill"></div></div>
        <span class="ptime" id="ctime">0:00 / 0:00</span>
        <button id="cfs" type="button" title="全屏">全屏</button>
      </div>
      <div class="fallback" id="fallback" role="button" tabindex="0" aria-label="在 YouTube 播放">
        <div class="fb-center">
          <div class="fb-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="fb-label" id="fbmsg">在 YouTube 播放</div>
          <div class="fb-note" id="fbtip">点时间码会在新标签页打开 YouTube，并跳到对应位置。</div>
        </div>
        <div class="fb-bar">
          <span class="grow" id="fbserve">本地文件打开时 YouTube 禁止内嵌；用本地服务预览即可在本页播放</span>
          <button class="fb-copy" id="fbcopy" type="button">复制预览命令</button>
          <a class="fb-open" id="openyt" target="_blank" rel="noopener">打开</a>
        </div>
      </div>
      <button class="ctoggle" id="cleanToggle" type="button" title="无干扰画面：用干净封面遮挡 YouTube 的标题栏 / 推荐 / 结束页；点此切换回原画面">无干扰 ✓</button>
    </div>
    <div class="panel heat" id="heatPanel">
      <h4><span>观看热度</span><span class="now" id="nowTs"></span></h4>
      <div id="heatSvg"></div>
      <div class="legend"><span><i style="background:#c9c4bd"></i>重复观看</span><span><i style="background:var(--ink);height:6px;width:6px;border-radius:50%;vertical-align:1px"></i>评论里提到的时间</span><span><i style="background:var(--accent)"></i>讨论热点</span></div>
    </div>
    <div class="panel toc" id="toc"><h4>目录</h4></div>
    <div class="panel" id="chapters" style="display:none"><h4>视频章节</h4></div>
  </aside>
  <main id="main"></main>
</div>
<script type="application/json" id="data">__DATA_JSON__</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta || {}, G = D.digest || {}, S = D.signals || {};
const VID = M.id;
const DUR = M.duration || 0;
const PLATFORM = (M.platform || (/youtube\.com|youtu\.be/.test(M.url || '') ? 'youtube' : 'generic'));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- time helpers */
function sec(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const s = String(v).trim().replace(/^\[|\]$/g,'');
  if (/^\d+(\.\d+)?s?$/.test(s)) return parseFloat(s);
  const p = s.split(':').map(Number); if (p.some(isNaN)) return null;
  return p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1];
}
function fmt(t){ t = Math.max(0, Math.round(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return (h? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0'); }
function link(t){
  const s = Math.floor(t || 0);
  if (PLATFORM === 'bilibili') return VID ? `https://www.bilibili.com/video/${VID}?t=${s}` : '#';
  if (PLATFORM === 'vimeo')   return VID ? `https://vimeo.com/${VID}#t=${Math.floor(s/60)}m${s%60}s` : '#';
  if (PLATFORM === 'youtube') return VID ? `https://www.youtube.com/watch?v=${VID}&t=${s}s` : '#';
  return (M.url || '#');   // generic: open the original platform page
}
function ts(v, cls){ const t = sec(v); if (t == null) return ''; return `<a class="ts ${cls||''}" data-t="${t}" href="${link(t)}" target="_blank" rel="noopener">${fmt(t)}</a>`; }
const cell = v => ts(v) || '<span></span>';
/* inline [mm:ss] / [h:mm:ss] in any text => timecode link */
function rich(text){
  return esc(text).replace(/\[((?:\d{1,2}:)?\d{1,2}:\d{2})(?:\s*[-–~]\s*(?:\d{1,2}:)?\d{1,2}:\d{2})?\]/g, (m, a) => ts(a, 'inline'))
                  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
const num = n => n == null ? '—' : n >= 1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,'')+' 亿' : n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,'')+' 万' : String(n);
/* if every item has the same speaker, say it once in the section note instead of on every card */
const soleSpeaker = arr => { const s = [...new Set((arr||[]).map(x=>x.speaker).filter(Boolean))]; return s.length === 1 && (arr||[]).every(x=>x.speaker) ? s[0] : null; };
function sourceLabel(src){
  if (!src) return '';
  let m;
  if ((m = src.match(/^substack:([^/]+)/))) return `${m[1].replace(/^www\./,'')} 发布的播客转写`;
  if ((m = src.match(/^yt-dlp:([\w-]+):(manual|auto)/))) return `YouTube ${m[2]==='auto'?'自动':'人工'}字幕（${m[1]}）`;
  if (src.startsWith('transcript-api')) return 'YouTube 字幕';

  return src;
}

/* ---------- player */
let player = null, ready = false, broken = false, lastSeek = 0;

$('#openyt').href = link(0);

function fbSet(msg, note){
  const m=$('#fbmsg'), tip=$('#fbtip');
  if (m) m.textContent = msg;
  if (tip && note != null) tip.textContent = note;
}
function showFallback(e){
  broken = true;
  const code = e && e.data != null ? e.data : null;
  window.__ytErr = code != null ? code : (e||'timeout');
  if (code === 101) fbSet('作者关闭了内嵌播放', '该视频不允许站外嵌入。点上方按钮或任意时间码，会在新标签页打开原视频并跳到对应位置。');
  else if (code === 150) fbSet('视频无法在页面内播放', '可能是作者关闭了内嵌，或当前网络受限。点时间码会在新标签页打开原视频并跳到对应位置。');
  else fbSet('在页面内播放', '本地文件打开时浏览器禁止内嵌。点时间码会在新标签页打开原视频并跳到对应位置；或用下方「复制预览命令」在本页直接播放。');
  const o=$('#openyt'); if (o) o.href = link(lastSeek);
  const f=$('#fallback'); if (f) f.style.display = 'block'; const y=$('#yt'); if (y) y.style.visibility='hidden';
  const c=$('#clean'); if (c) c.classList.remove('on');
  const tg=$('#cleanToggle'); if (tg) tg.style.display = 'none';
}
function jump(t){
  lastSeek = t;
  document.querySelectorAll('a.ts.playing').forEach(a=>a.classList.remove('playing'));
  if (ready && !broken && player && player.seekTo){
    player.seekTo(t, true); player.playVideo && player.playVideo();
    if (window.innerWidth <= 1020) $('.player').scrollIntoView({behavior:'smooth', block:'start'});
    return true;
  }
  window.open(link(t), '_blank', 'noopener'); return false;
}
document.addEventListener('click', e=>{
  const a = e.target.closest('a.ts'); if (!a) return;
  e.preventDefault(); if (jump(parseFloat(a.dataset.t))) a.classList.add('playing');
});
/* poster interactions: click anywhere -> open on YouTube; copy the local-preview command */
(function(){
  const f = $('#fallback');
  if (f){
    f.addEventListener('click', ()=> window.open(link(lastSeek), '_blank', 'noopener'));
    f.addEventListener('keydown', e=>{ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); window.open(link(lastSeek), '_blank', 'noopener'); } });
  }
  const bar = f && f.querySelector('.fb-bar');
  if (bar) bar.addEventListener('click', e=> e.stopPropagation());   // don't double-open from the bar
  const cp = $('#fbcopy');
  if (cp) cp.addEventListener('click', e=>{
    e.stopPropagation();
    const cmd = (M.serve_cmd || '').trim(); if (!cmd) return;
    const done = ()=>{ cp.textContent = '已复制'; cp.classList.add('done');
      setTimeout(()=>{ cp.textContent = '复制预览命令'; cp.classList.remove('done'); }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cmd).then(done).catch(()=>{});
    else { const ta=document.createElement('textarea'); ta.value=cmd; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(_){} ta.remove(); }
  });
  const sv = $('#fbserve'); if (sv && M.serve_cmd) sv.title = M.serve_cmd;
})();
// when the page is opened directly as a file, surface the auto-started localhost
// preview so the video can still play in-page (YouTube blocks file:// embedding)
(function(){
  if (!IS_FILE || !M.preview_url) return;

  if (s){
    s.innerHTML = '已启动本地预览（本页可播放）：<a class="fb-open" href="' + M.preview_url

  }
})();
if (!VID){ showFallback(); }
else if (PLATFORM === 'youtube'){
  if (IS_FILE) showFallback();   // file:// can't embed — show the poster at once, no 12s black wait
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('yt', { videoId: VID, playerVars: { rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, origin: location.protocol.startsWith('http')? location.origin: undefined },
      events: { onReady: ()=>{ ready = true; broken = false;
                  const f=$('#fallback'); if (f) f.style.display='none';
                  const y=$('#yt'); if (y) y.style.visibility='visible';
                  if (window.__cleanPending){ window.__cleanPending = false; window.__cleanPlay && window.__cleanPlay(); } },
                onStateChange: e=>{ window.__cleanState && window.__cleanState(e.data); },
                onError: showFallback } });

  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = ()=>showFallback(); document.head.appendChild(s);

else if (PLATFORM === 'bilibili'){
  const f = document.createElement('iframe'); f.id = 'yt'; f.allow = 'autoplay; fullscreen; encrypted-media';
  f.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
  f.src = `https://player.bilibili.com/player.html?bvid=${VID}&page=1&high_quality=1&autoplay=0&danmaku=0`;
  const old = $('#yt'); if (old && old.parentNode) old.parentNode.replaceChild(f, old);
  player = f;
  let btime = 0, bstate = -1;

  window.addEventListener('message', function(ev){
    const d = ev.data; if (!d || typeof d !== 'object') return;
    if (d.event === 'playing'){ bstate = 1; ready = true; }
    else if (d.event === 'pause'){ bstate = 2; }
    else if (d.event === 'ended'){ bstate = 0; }
    else if (d.event === 'ready'){ ready = true; }
    else if (d.event === 'timeupdate' && typeof d.value === 'number'){ btime = d.value; }
    else if (d.event === 'durationchange' && typeof d.value === 'number'){ DUR = d.value; }
  });
  f.seekTo = (t)=> f.contentWindow && f.contentWindow.postMessage({command:'seek', value: Math.floor(t)}, '*');
  f.playVideo = ()=> f.contentWindow && f.contentWindow.postMessage({command:'play'}, '*');
  f.pauseVideo = ()=> f.contentWindow && f.contentWindow.postMessage({command:'pause'}, '*');
  f.getCurrentTime = ()=> btime;
  f.getDuration = ()=> DUR || 0;
  f.getPlayerState = ()=> bstate;
  if (!IS_FILE) setTimeout(()=>{ if (!ready) showFallback(); }, 12000);
}
else { showFallback(); }   // generic / vimeo: no in-page player; timecode links open the original

/* ---------- clean (no-distraction) surface ----------
   Cross-origin YouTube chrome (title bar, channel row, "more videos", end-screen
   suggestions, share/watch-later, watermark) can't be styled away with CSS. We keep an
   always-on, transparent-while-playing SHIELD above the iframe: it swallows pointer
   events so YouTube never even gets a hover (and never shows its own chrome); while
   paused/ended the shield becomes an opaque poster cover. Our minimal controls are in #cbar. */
(function(){
  const clean = $('#clean'), img = $('#cleanImg'), msg = $('#cleanMsg'), tg = $('#cleanToggle');
  const cbar = $('#cbar'), pfill = $('#cpfill'), ptrack = $('#cprog'), ctime = $('#ctime');
  if (!clean) return;
  if (IS_FILE || !VID || broken){ if (tg) tg.style.display = 'none'; if (cbar) cbar.style.display = 'none'; clean.style.display = 'none'; return; }
  let enabled = localStorage.getItem('yt-clean') !== 'off';
  if (img){
    img.src = 'https://i.ytimg.com/vi/' + VID + '/maxresdefault.jpg';
    img.onerror = ()=>{ img.onerror = null; img.src = M.thumbnail || ('https://i.ytimg.com/vi/' + VID + '/hqdefault.jpg'); };
  }

  function reflect(){
    if (tg){ tg.textContent = enabled ? '无干扰 ✓' : '原画面'; tg.classList.toggle('on', enabled); }
    clean.style.visibility = enabled ? 'visible' : 'hidden';
    clean.style.pointerEvents = enabled ? 'auto' : 'none';
    if (cbar) cbar.style.display = enabled ? '' : 'none';
  }
  function opaque(text){ if (!enabled || broken) return; if (msg && text) msg.textContent = text; clean.classList.add('on'); }
  function veil(){ clean.classList.remove('on'); }                 // transparent shield while playing
  function play(){                                                  // click on the shield → toggle play/pause
    if (!ready || broken || !player){ window.__cleanPending = true; return; }
    if (player.getPlayerState && player.getPlayerState() === 1) player.pauseVideo();
    else player.playVideo();
  }

  clean.addEventListener('click', play);
  clean.addEventListener('keydown', e=>{ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); play(); } });
  if (ptrack) ptrack.addEventListener('click', e=>{
    e.stopPropagation();
    if (!(ready && !broken && player && player.getDuration)) return;
    const r = ptrack.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    player.seekTo(p * (player.getDuration() || DUR || 0), true);
  });
  if (cbar) cbar.addEventListener('click', e=> e.stopPropagation());
  if ($('#cfs')) $('#cfs').addEventListener('click', e=>{
    e.stopPropagation();
    const box = document.querySelector('.player');
    if (!box) return;
    if (!document.fullscreenElement){ (box.requestFullscreen || box.webkitRequestFullscreen || function(){}).call(box); }
    else { (document.exitFullscreen || function(){}).call(document); }
  });
  if (tg) tg.addEventListener('click', e=>{
    e.stopPropagation();
    enabled = !enabled; localStorage.setItem('yt-clean', enabled ? 'on' : 'off'); reflect();
    if (!enabled) veil();
    else if (ready && !broken && player && player.getPlayerState && player.getPlayerState() !== 1) opaque('继续播放');
  });

  window.__cleanPlay = play;
  window.__cleanState = function(st){
    if (!enabled || broken){ return; }
    if (st === 1) veil();                          // PLAYING  → transparent shield (still blocks hover chrome)
    else if (st === 2) opaque('已暂停 · 点击继续');  // PAUSED   → opaque poster cover
    else if (st === 0) opaque('播放结束 · 点击重播');// ENDED    → opaque poster cover
  };
  // progress ticker for our own clean control bar
  setInterval(()=>{
    if (!enabled || !(ready && !broken && player && player.getCurrentTime)) return;
    const t = player.getCurrentTime() || 0;
    const d = (player.getDuration && player.getDuration()) || DUR || 0;
    if (pfill) pfill.style.width = (d ? (t / d * 100) : 0) + '%';
    if (ctime) ctime.textContent = fmt(t) + ' / ' + fmt(d);
  }, 500);
  reflect();
  opaque('播放');   // clean poster first so YouTube's initial chrome never shows
})();

/* ---------- follow playback in transcript */
const trRows = [...document.querySelectorAll('#tr .row')];
let follow = true;
setInterval(()=>{
  if (!ready || broken || !player.getCurrentTime) return;
  const t = player.getCurrentTime(); $('#nowTs').textContent = fmt(t); window.__heatCursor && window.__heatCursor(t);
  if (!trRows.length || !follow) return;
  let k = 0; for (let i=0;i<trRows.length;i++){ if (parseFloat(trRows[i].dataset.t) <= t) k = i; else break; }
  const cur = document.querySelector('#tr .row.active');
  if (cur !== trRows[k]){ cur && cur.classList.remove('active'); trRows[k].classList.add('active');
    const box = $('#tr'); box.scrollTo({ top: trRows[k].offsetTop - box.offsetTop - 120, behavior: 'smooth' }); }
}, 800);
const q = $('#q'); if (q) q.addEventListener('input', ()=>{
  const v = q.value.trim().toLowerCase();
  trRows.forEach(r=>{ const zh=r.querySelector('.zh'), en=r.querySelector('.en');
    if (!zh.dataset.o) zh.dataset.o = zh.textContent; if (en && !en.dataset.o) en.dataset.o = en.textContent;
    const hit = !v || zh.dataset.o.toLowerCase().includes(v) || (en && en.dataset.o.toLowerCase().includes(v));
    r.classList.toggle('hide', !hit);
    const hl = s => v ? esc(s).replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`) : esc(s);
    zh.innerHTML = hl(zh.dataset.o); if (en) en.innerHTML = hl(en.dataset.o); });
});
const bi = $('#bi'); if (bi) bi.addEventListener('click', ()=>{ const on = $('#tr').classList.toggle('bi'); bi.classList.toggle('on', on); bi.textContent = on? '隐藏英文':'显示英文'; });
const fo = $('#follow'); if (fo) fo.addEventListener('click', ()=>{ follow = !follow; fo.classList.toggle('on', follow); });

/* ---------- read-aloud: full article (voice reading) */
(function(){
  const btn = document.getElementById('readAll');
  const langSel = document.getElementById('rdLang');
  const rateSel = document.getElementById('rdRate');
  const srcSel  = document.getElementById('rdSrc');
  if (!btn) return;
  const synth = window.speechSynthesis;
  if (!synth){
    const bar = btn.closest('.readbar');
    if (bar) bar.insertAdjacentHTML('beforeend', '<span class="tip" style="align-self:center">当前浏览器不支持语音朗读</span>');
    [btn, langSel, rateSel, srcSel].forEach(el => el && el.remove());
    return;
  }
  /* shared audio lifecycle: edge/doubao HTMLAudioElement is NOT tracked by speechSynthesis */
  let audio = null;                 // currently playing <audio> for edge/doubao
  let edgeDead = false, doubaoDead = false;   // runtime source failure flags → degrade whole session, not per sentence
  function killAudio(){ if (audio){ try{ audio.pause(); audio.onended = null; audio.onerror = null; }catch(e){} audio = null; } }
  function srcTip(name){ const bar = btn.closest('.readbar'); if (bar && !bar.querySelector('.tip')) bar.insertAdjacentHTML('beforeend', '<span class="tip" style="align-self:center">'+name+'暂不可用，已切换为浏览器朗读</span>'); }
  /* ---- voice sources (browser native / 豆包 / 微软 Edge via local /tts proxy) ---- */
  function makeNative(){
    return {
      name: 'native',
      speak(item, rate){
        return new Promise(res => {
          const u = new SpeechSynthesisUtterance(item.t);
          u.lang = item.lang; const v = pickVoice(item.lang); if (v) u.voice = v;
          u.rate = rate; u.pitch = 1.04;
          u.onend = () => res(); u.onerror = () => res();
          synth.speak(u);
        });
      },
      pause(){ try{ synth.pause(); }catch(e){} },
      resume(){ try{ synth.resume(); }catch(e){} },
      stop(){ try{ synth.cancel(); }catch(e){} }
    };
  }
  function makeDoubao(){
    return {
      name: 'doubao',
      speak(item, rate){
        return fetch('/tts', { method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ text: item.t, lang: item.lang, rate: rate }) })
          .then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.blob(); })
          .then(blob => new Promise(res => {
            const a = new Audio(URL.createObjectURL(blob)); audio = a;
            const done = () => { try{ URL.revokeObjectURL(a.src); }catch(e){} if (audio === a) audio = null; res(); };
            a.onended = done; a.onerror = () => { done(); };
            if (paused) return;                       // do not auto-play while paused; resume() will play it
            a.play().catch(() => { done(); });
          }))
          .catch(() => { doubaoDead = true; srcTip('豆包'); return native.speak(item, rate); });
      },
      pause(){ if (audio) try{ audio.pause(); }catch(e){} },
      resume(){ if (audio) audio.play().catch(()=>{}); },
      stop(){ killAudio(); }
    };
  }
  function makeEdge(){
    return {
      name: 'edge',
      speak(item, rate){
        return fetch('/tts', { method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ source:'edge', text: item.t, lang: item.lang, rate: rate }) })
          .then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.blob(); })
          .then(blob => new Promise(res => {
            const a = new Audio(URL.createObjectURL(blob)); audio = a;
            const done = () => { try{ URL.revokeObjectURL(a.src); }catch(e){} if (audio === a) audio = null; res(); };
            a.onended = done; a.onerror = () => { done(); };
            if (paused) return;                       // do not auto-play while paused; resume() will play it
            a.play().catch(() => { done(); });
          }))
          .catch(() => { edgeDead = true; srcTip('微软语音'); return native.speak(item, rate); });  // 整段降级到浏览器原生，而非单句跳变
      },
      pause(){ if (audio) try{ audio.pause(); }catch(e){} },
      resume(){ if (audio) audio.play().catch(()=>{}); },
      stop(){ killAudio(); }
    };
  }
  const native = makeNative(), doubao = makeDoubao(), edge = makeEdge();
  let doubaoReady = false, edgeReady = false;
  function speaker(){
    const v = srcSel && srcSel.value;
    if (v === 'edge' && edgeReady && !edgeDead) return edge;
    if (v === 'doubao' && doubaoReady && !doubaoDead) return doubao;
    return native;
  }
  if (srcSel){
    const canUseTtsProxy = location.protocol !== 'file:' && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname || '');
    if (!canUseTtsProxy){
      // 离线 / 非本地服务：没有 /tts 代理可用，仅保留浏览器原生朗读（无需任何服务器）
      ['edge','doubao'].forEach(v => { const o = srcSel.querySelector('option[value="'+v+'"]'); if (o) o.hidden = true; });
      srcSel.title = '朗读音源（离线可用：浏览器原生）';
    } else {
      fetch('/tts/status', { cache:'no-store' }).then(r => r.json()).then(d => {
        if (d && d.edge){
          edgeReady = true; const o = srcSel.querySelector('option[value="edge"]'); if (o) o.hidden = false;
          srcSel.title = '朗读音源（微软语音 · 晓晓 Neural，免费最自然）';
          if (srcSel.value === 'native') srcSel.value = 'edge';   // 自动选用最自然的中文音色
        }
        if (d && d.doubao){
          doubaoReady = true; const o = srcSel.querySelector('option[value="doubao"]'); if (o) o.hidden = false;
          if (!edgeReady) srcSel.title = '朗读音源（豆包可用）';
        }
      }).catch(() => {});
    }
  }
  function voices(){ return synth.getVoices() || []; }
  function pickVoice(lang){
    const vs = voices(); if (!vs.length) return null;
    const pre = (lang||'zh').split('-')[0].toLowerCase();
    const same = vs.filter(v => (v.lang||'').toLowerCase().startsWith(pre));
    if (!same.length) return null;
    const prefer = pre === 'zh'
      ? ['neural','google','xiaoxiao','yunxi','yunyang','ting-ting','mei-jia','yaoyao','huihui','kangkang']
      : ['neural','samantha','google','aria','jenny','zira','guy'];
    const low = v => (v.name||'').toLowerCase();
    for (const p of prefer){ const f = same.find(v => low(v).includes(p)); if (f) return f; }
    return same[0];
  }
  function splitSent(t){
    const raw = String(t).split(/([。！？!?；;])/);
    const out = []; let buf = '';
    for (let i=0;i<raw.length;i++){ buf += raw[i]; if (/[。！？!?；;]/.test(raw[i])){ const s = buf.trim(); if (s) out.push(s); buf=''; } }
    if (buf.trim()) out.push(buf.trim());
    return out.length ? out : [String(t).trim()].filter(Boolean);
  }
  function langOf(t){ return /[一-龥]/.test(t) ? 'zh-CN' : 'en-US'; }
  /* ---- timecode reading fix (request F) ----
     Chinese TTS reads "07:20" as "零七点二十"; the user wants "零七分二十秒".
     We rewrite MM:SS / H:MM:SS to a spoken form before sending to any voice engine.
     Leading fields are read digit-by-digit (so "07" stays "零七"), the seconds field
     is read as a proper number ("20" → "二十"). English segments are left untouched. */
  const DIGIT = '零一二三四五六七八九';
  function digitsToCn(s){ return String(s).split('').map(c => DIGIT[+c] != null ? DIGIT[+c] : c).join(''); }
  function num2ToCn(n){ n = +n; if (n < 10) return DIGIT[n]; if (n < 20) return '十' + DIGIT[n % 10];
    const t = Math.floor(n / 10), o = n % 10; return DIGIT[t] + '十' + (o ? DIGIT[o] : ''); }
  function zhTimeFix(t){
    /* ':' or the full-width '：' both mean minutes/seconds, never "点". */
    return String(t)
      .replace(/(\d{1,2})[:：](\d{2})[:：](\d{2})/g, (m, a, b, c) => digitsToCn(a) + '时' + digitsToCn(b) + '分' + num2ToCn(c) + '秒')
      .replace(/(\d{1,2})[:：](\d{2})/g, (m, a, b) => digitsToCn(a) + '分' + num2ToCn(b) + '秒');
  }
  const SEL = [
    '.oneliner',
    'main section > h2',
    '#summary .value', '#summary ul.clean li', '#summary .caveat',
    '#framework .tl .node',
    '#viewpoints .vcard',
    '#quotes blockquote',
    '#conflicts .cf',
    '#hotspots .hs',
    '#comments .ci > div',
    '#resources ul.res li', '#glossary ul.res li',
    '#tr .row'
  ].join(',');
  function segmentsFor(el, mode){
    const zhEl = el.querySelector ? el.querySelector('.zh') : null;
    const enEl = el.querySelector ? el.querySelector('.en') : null;
    const zhRaw = (zhEl ? zhEl.textContent : el.textContent).trim();
    const zh = langOf(zhRaw) === 'zh-CN' ? zhTimeFix(zhRaw) : zhRaw;
    const en = enEl ? enEl.textContent.trim() : '';
    const segs = [];
    if (mode === 'en'){
      if (en) segs.push({t:en, lang:'en-US'});
      else if (zh && langOf(zh) === 'en-US') segs.push({t:zh, lang:'en-US'});
    } else if (mode === 'bi'){
      if (zh) segs.push({t:zh, lang: langOf(zh)});
      if (en) segs.push({t:en, lang:'en-US'});
    } else {
      if (zh) segs.push({t:zh, lang: langOf(zh)});
    }
    const out = [];
    for (const s of segs) for (const piece of splitSent(s.t)) out.push({t:piece, lang:s.lang});
    return out;
  }
  let queue = [], qi = 0, paused = false, speaking = false, epoch = 0, lastHi = null;
  function clearHi(){ document.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking')); lastHi = null; }
  function highlight(el){ if (el === lastHi) return; lastHi = el; clearHi(); if (el){ el.classList.add('speaking'); el.scrollIntoView({block:'center', behavior:'smooth'}); } }
  async function speakCurrent(ep){
    if (ep !== epoch || paused) return;
    if (qi >= queue.length){ finish(); return; }
    const cur = queue[qi];
    highlight(cur.el);
    await speaker().speak(cur, (rateSel ? parseFloat(rateSel.value) || 1 : 1));
    if (ep !== epoch || paused) return;
    qi++; setTimeout(() => speakCurrent(ep), 110);
  }
  function buildQueue(){
    const mode = langSel ? langSel.value : 'zh';
    const items = [].slice.call(document.querySelectorAll(SEL)).filter(el => segmentsFor(el, mode).length);
    const q = [];
    for (const el of items) for (const s of segmentsFor(el, mode)) q.push({el:el, t:s.t, lang:s.lang});
    return q;
  }
  function start(){
    if (speaking && paused){                       // resume a paused read
      paused = false; setLabel('暂停');
      const s = speaker();
      if (s === native){ try{ synth.resume(); }catch(e){} }
      else if (audio){ audio.play().catch(()=>{}); }   // audio exists → resume it
      return;                                      // (if fetch still pending, it auto-plays once paused=false)
    }
    killAudio();                                   // stop any in-flight audio from a previous session (fix overlap)
    queue = buildQueue(); qi = 0;
    if (!queue.length) return;
    epoch++; speaking = true; paused = false; btn.classList.add('on'); setLabel('暂停');
    try{ synth.cancel(); }catch(e){}
    speakCurrent(epoch);
  }
  function pause(){ if (!speaking) return; paused = true; setLabel('继续'); const s = speaker(); if (s === native){ try{ synth.pause(); }catch(e){} } else if (audio){ try{ audio.pause(); }catch(e){} } }
  function finish(){ epoch++; speaking = false; paused = false; killAudio(); try{ synth.cancel(); }catch(e){} clearHi(); btn.classList.remove('on'); setLabel('朗读全文'); }
  function setLabel(t){ const l = btn.querySelector('.lbl'); if (l) l.textContent = t; }
  btn.addEventListener('click', () => { if (speaking && !paused) pause(); else start(); });
  if (langSel) langSel.addEventListener('change', () => { if (speaking){ const wasPaused = paused; finish(); if (!wasPaused) start(); } });
  if (srcSel) srcSel.addEventListener('change', () => { if (speaking){ const wasPaused = paused; finish(); if (!wasPaused) start(); } });
  /* ---- double-click any block → read from that block onward (request H) ---- */
  function startFrom(el){
    const mode = langSel ? langSel.value : 'zh';
    const all = [].slice.call(document.querySelectorAll(SEL));
    const idx = all.indexOf(el);
    if (idx < 0) return;
    killAudio();                                   // stop the current read so double-click never overlaps (fix bug③)
    queue = []; qi = 0;
    for (let i = idx; i < all.length; i++) for (const s of segmentsFor(all[i], mode)) queue.push({el: all[i], t: s.t, lang: s.lang});
    if (!queue.length) return;
    epoch++; speaking = true; paused = false; btn.classList.add('on'); setLabel('暂停');
    try{ synth.cancel(); }catch(e){}
    speakCurrent(epoch);
  }
  if (typeof main !== 'undefined' && main) main.addEventListener('dblclick', e => {
    const el = e.target.closest(SEL);
    if (!el) return;
    startFrom(el);
  });
  setInterval(() => { if (speaking && !paused && synth.speaking && !synth.paused){ try { synth.resume(); } catch(e){} } }, 5000);
})();
})();
</script>
